<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cube</title>
<meta name="description" content="A Rubik's Cube you solve with your keyboard. Scramble it, turn the sides with A S D and J K L, and race the timer.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: the cube in the middle of a black stage, the timer and buttons under it, the key guide at the bottom. Black and white; only the stickers have color. */
:root {
  color-scheme: dark;
  --bg: #000; --ink: #fff; --muted: #8a8a8a; --line: #2a2a2a; --panel: #0d0d0d;
  --c: clamp(44px, 13vw, 72px);          /* one small cube */
  --f-display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); }
body { color: var(--ink); font: 16px/1.5 var(--f-display); -webkit-text-size-adjust: 100%;
  padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(16px, env(safe-area-inset-left, 0px)); }
#app { max-width: 640px; margin: 0 auto; padding-bottom: 32px; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
header { display: flex; align-items: center; justify-content: space-between; padding: 16px 0 0; }
.brand { font: 700 20px/1 var(--f-display); letter-spacing: -0.02em; }
.brand b { background: var(--ink); color: var(--bg); padding: 1px 6px; margin-left: 2px; }
.small { font: 500 12px/1.4 var(--f-mono); color: var(--muted); letter-spacing: 0.04em; }

/* the 3D stage */
.stage { position: relative; height: calc(var(--c) * 6.4); perspective: calc(var(--c) * 16); touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
.stage:active { cursor: grabbing; }
.cube { position: absolute; left: 50%; top: 50%; width: 0; height: 0; transform-style: preserve-3d; }
.st { position: absolute; left: calc(var(--c) / -2); top: calc(var(--c) / -2); width: var(--c); height: var(--c); background: #050505; transform-style: preserve-3d; backface-visibility: hidden; }
.st::after { content: ""; position: absolute; inset: 7%; border-radius: 12%; background: var(--col); }
.banner { position: absolute; left: 0; right: 0; bottom: 6px; text-align: center; font: 700 22px var(--f-display); letter-spacing: -0.02em; opacity: 0; transition: opacity 0.25s; pointer-events: none; }
.banner.on { opacity: 1; }

/* timer, counter and buttons */
.stats { display: flex; justify-content: center; gap: 28px; margin: 6px 0 14px; }
.stats div { text-align: center; }
.stats b { display: block; font: 700 34px/1 var(--f-display); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 20px; border-radius: 12px; border: 1px solid var(--ink); background: var(--ink); color: var(--bg); font: 700 16px/1 var(--f-display); cursor: pointer; }
.btn.ghost { background: transparent; color: var(--ink); border-color: #4a4a4a; }
.btn:disabled { opacity: 0.35; cursor: default; }
.status { min-height: 22px; text-align: center; color: var(--muted); margin: 10px 0 0; font-size: 14px; }

/* key guide and touch pad */
.guide { margin-top: 22px; border-top: 1px solid var(--line); padding-top: 16px; }
.pad { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.key { min-height: 46px; border-radius: 10px; border: 1px solid #3a3a3a; background: var(--panel); color: var(--ink); font: 700 17px var(--f-display); cursor: pointer; }
.key small { display: block; font: 500 10px var(--f-mono); color: var(--muted); letter-spacing: 0.04em; }
.key.flash { background: var(--ink); color: var(--bg); }
.key.flash small { color: #333; }
.legend { margin-top: 14px; color: #cfcfcf; font-size: 14px; }
.legend kbd { font: 500 12px var(--f-mono); border: 1px solid #444; border-bottom-width: 2px; border-radius: 5px; padding: 1px 6px; color: var(--ink); background: var(--panel); }
@media (prefers-reduced-motion: reduce) { .banner { transition: none; } }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">cube<b>keys</b></div>
  </header>

  <div class="stage" id="stage" aria-label="Your cube. Drag to look around."><div class="cube" id="cube"></div><div class="banner" id="banner">Solved!</div></div>

  <div class="stats">
    <div><b id="time">0:00.0</b><span class="small">TIME</span></div>
    <div><b id="count">0</b><span class="small">MOVES</span></div>
  </div>
  <div class="row">
    <button class="btn" id="scramble">Scramble</button>
    <button class="btn ghost" id="reset">Reset</button>
    <button class="btn ghost" id="helpme">Solve it for me</button>
  </div>
  <p class="status" id="status" aria-live="polite">Press Scramble.</p>

  <div class="guide">
    <div class="pad" id="pad"></div>
  </div>
</div>

<script>
/* ---------- Cube model: stickers, moves, validity, and colour reading. Pure functions, no page access. ---------- */
var LETTERS = "URFDLB";                                   // the six faces, in the order the solver expects
var FSTART = { U: 0, R: 9, F: 18, D: 27, L: 36, B: 45 }; // where each face begins in a 54-letter string
var SOLVED = "UUUUUUUUURRRRRRRRRFFFFFFFFFDDDDDDDDDLLLLLLLLLBBBBBBBBB";
var CENTERS = [4, 13, 22, 31, 40, 49];

// Where every sticker sits in 3D (x right, y up, z toward you), using the standard unfolded-cross layout.
// Each face lists its 9 stickers row by row, as seen from outside with the top up (U is seen from above with the back at the top, D from below with the front at the top).
function stickerGeom(f, k) {
  var r = Math.floor(k / 3), c = k % 3;
  switch (f) {
    case "U": return { cell: [c - 1, 1, r - 1], n: [0, 1, 0] };
    case "D": return { cell: [c - 1, -1, 1 - r], n: [0, -1, 0] };
    case "F": return { cell: [c - 1, 1 - r, 1], n: [0, 0, 1] };
    case "B": return { cell: [1 - c, 1 - r, -1], n: [0, 0, -1] };
    case "R": return { cell: [1, 1 - r, 1 - c], n: [1, 0, 0] };
    default:  return { cell: [-1, 1 - r, c - 1], n: [-1, 0, 0] };   // L
  }
}
var STK = [], KEYIDX = {};
LETTERS.split("").forEach(function (f) { for (var k = 0; k < 9; k++) { var g = stickerGeom(f, k); STK.push({ face: f, k: k, cell: g.cell, n: g.n }); } });
STK.forEach(function (s, i) { KEYIDX[s.cell.join(",") + "|" + s.n.join(",")] = i; });

// A clockwise quarter turn, seen from outside the face: rotate -90 degrees about the face's outward direction.
function rotCW(n, v) {
  var cr = [n[1] * v[2] - n[2] * v[1], n[2] * v[0] - n[0] * v[2], n[0] * v[1] - n[1] * v[0]], d = n[0] * v[0] + n[1] * v[1] + n[2] * v[2];
  return [-cr[0] + n[0] * d, -cr[1] + n[1] * d, -cr[2] + n[2] * d];
}
var MOVE_PERM = {};
LETTERS.split("").forEach(function (f) {
  var n = STK[FSTART[f]].n, p = [];
  for (var i = 0; i < 54; i++) {
    var s = STK[i], dot = n[0] * s.cell[0] + n[1] * s.cell[1] + n[2] * s.cell[2];
    if (dot === 1) p.push(KEYIDX[rotCW(n, s.cell).join(",") + "|" + rotCW(n, s.n).join(",")]); else p.push(i);
  }
  MOVE_PERM[f] = p;
});
function applyMove(str, tok) {
  var f = tok.charAt(0), times = tok.length === 1 ? 1 : (tok.charAt(1) === "'" ? 3 : 2), p = MOVE_PERM[f], s = str.split("");
  if (!p) throw new Error("Unknown move " + tok);
  for (var t = 0; t < times; t++) { var o = new Array(54); for (var i = 0; i < 54; i++) o[p[i]] = s[i]; s = o; }
  return s.join("");
}
function parseAlg(alg) { return String(alg || "").trim().split(/\s+/).filter(Boolean); }
function applyAlg(str, alg) { parseAlg(alg).forEach(function (m) { str = applyMove(str, m); }); return str; }
function invertAlg(alg) { return parseAlg(alg).reverse().map(function (m) { return m.length === 1 ? m + "'" : (m.charAt(1) === "'" ? m.charAt(0) : m); }).join(" "); }
function randomScramble(n) {
  var out = [], last = "", faces = LETTERS.split(""), mods = ["", "'", "2"];
  while (out.length < (n || 22)) { var f = faces[Math.floor(Math.random() * 6)]; if (f === last) continue; last = f; out.push(f + mods[Math.floor(Math.random() * 3)]); }
  return out.join(" ");
}

// Is this a cube that could really exist? Looks at the corner and edge pieces, how they are twisted, and how they are swapped.
var CELLS = {};
STK.forEach(function (s, i) { var key = s.cell.join(","); (CELLS[key] = CELLS[key] || []).push(i); });
var CORNERS = [], EDGES = [];
function det3(a, b, c) { return a[0] * (b[1] * c[2] - b[2] * c[1]) - a[1] * (b[0] * c[2] - b[2] * c[0]) + a[2] * (b[0] * c[1] - b[1] * c[0]); }
Object.keys(CELLS).forEach(function (key) {
  var idx = CELLS[key];
  if (idx.length === 3) {
    var s0 = idx.filter(function (i) { return STK[i].n[1] !== 0; })[0], o = idx.filter(function (i) { return i !== s0; });
    CORNERS.push(det3(STK[s0].n, STK[o[0]].n, STK[o[1]].n) > 0 ? [s0, o[0], o[1]] : [s0, o[1], o[0]]);
  } else if (idx.length === 2) {
    var a = idx.filter(function (i) { return STK[i].n[1] !== 0; })[0];
    if (a === undefined) a = idx.filter(function (i) { return STK[i].n[2] !== 0; })[0];
    EDGES.push([a, idx.filter(function (i) { return i !== a; })[0]]);
  }
});
var HOME_C = {}, HOME_E = {};
function pkey(l) { return l.slice().sort().join(""); }
CORNERS.forEach(function (cell, j) { var l = cell.map(function (i) { return SOLVED.charAt(i); }); HOME_C[pkey(l)] = { cell: j, letters: l }; });
EDGES.forEach(function (cell, j) { var l = cell.map(function (i) { return SOLVED.charAt(i); }); HOME_E[pkey(l)] = { cell: j, letters: l }; });
function parity(perm) { var seen = [], cyc = 0; for (var i = 0; i < perm.length; i++) { if (seen[i]) continue; cyc++; var j = i; while (!seen[j]) { seen[j] = true; j = perm[j]; } } return (perm.length - cyc) % 2; }

// Returns { ok, message, cells } where cells lists sticker numbers worth highlighting.
function analyzeCube(str) {
  var counts = {}, i;
  if (str.length !== 54) return { ok: false, message: "The cube needs 54 stickers.", cells: [] };
  for (i = 0; i < 54; i++) counts[str.charAt(i)] = (counts[str.charAt(i)] || 0) + 1;
  for (i = 0; i < 6; i++) if (counts[LETTERS.charAt(i)] !== 9) return { ok: false, message: "Each color must appear exactly 9 times.", cells: [] };
  function check(list, HOME, size) {
    var info = list.map(function (cell) { var l = cell.map(function (x) { return str.charAt(x); }), k = pkey(l); return { cell: cell, l: l, k: k, home: HOME[k] }; });
    var tally = {}; info.forEach(function (p) { tally[p.k] = (tally[p.k] || 0) + 1; });
    var bad = []; info.forEach(function (p) { if (!p.home || tally[p.k] > 1) bad = bad.concat(p.cell); });
    return { info: info, bad: bad };
  }
  var C = check(CORNERS, HOME_C, 3), E = check(EDGES, HOME_E, 2);
  if (C.bad.length || E.bad.length) return { ok: false, message: "Some pieces can't exist on a real cube, so a sticker was probably read wrong. The highlighted pieces are the suspects.", cells: C.bad.concat(E.bad) };
  var twist = 0, mirrored = [];
  C.info.forEach(function (p) {
    var t = p.l.indexOf(p.home.letters[0]);
    if (!(p.l[(t + 1) % 3] === p.home.letters[1] && p.l[(t + 2) % 3] === p.home.letters[2])) mirrored = mirrored.concat(p.cell);
    twist += t;
  });
  if (mirrored.length) return { ok: false, message: "A corner has its colors in an impossible order. The highlighted corner is the suspect.", cells: mirrored };
  var flip = 0; E.info.forEach(function (p) { if (p.l[0] !== p.home.letters[0]) flip++; });
  if (twist % 3 !== 0) return { ok: false, message: "One corner looks twisted. Look for a corner whose colors are in the wrong order.", cells: [] };
  if (flip % 2 !== 0) return { ok: false, message: "One edge looks flipped. Look for an edge with its two colors the wrong way round.", cells: [] };
  var cp = C.info.map(function (p) { return p.home.cell; }), ep = E.info.map(function (p) { return p.home.cell; });
  if (parity(cp) !== parity(ep)) return { ok: false, message: "Two pieces look swapped. Check the stickers on pieces that are the same shape.", cells: [] };
  return { ok: true, message: "", cells: [] };
}

// Reading colours. Photos are compared in the Lab colour space, where distance roughly matches how different two colors look.
function srgbToLin(c) { c /= 255; return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); }
function rgbToLab(c) {
  var R = srgbToLin(c[0]), G = srgbToLin(c[1]), B = srgbToLin(c[2]);
  var X = (0.4124 * R + 0.3576 * G + 0.1805 * B) / 0.95047, Y = 0.2126 * R + 0.7152 * G + 0.0722 * B, Z = (0.0193 * R + 0.1192 * G + 0.9505 * B) / 1.08883;
  function f(t) { return t > 0.008856 ? Math.cbrt(t) : 7.787 * t + 16 / 116; }
  var fx = f(X), fy = f(Y), fz = f(Z);
  return [116 * fy - 16, 500 * (fx - fy), 200 * (fy - fz)];
}
function labDist(a, b) { var dl = (a[0] - b[0]) * 0.6, da = a[1] - b[1], db = a[2] - b[2]; return Math.sqrt(dl * dl + da * da + db * db); }
// Best way to match rows to columns at the lowest total cost (the Hungarian method). Needs rows <= columns.
function hungarian(a) {
  var n = a.length, m = a[0].length, u = [], v = [], p = [], way = [], i, j;
  for (i = 0; i <= n; i++) u.push(0); for (j = 0; j <= m; j++) { v.push(0); p.push(0); way.push(0); }
  for (i = 1; i <= n; i++) {
    p[0] = i; var j0 = 0, minv = [], used = [];
    for (j = 0; j <= m; j++) { minv.push(Infinity); used.push(false); }
    do {
      used[j0] = true; var i0 = p[j0], delta = Infinity, j1 = 0;
      for (j = 1; j <= m; j++) if (!used[j]) {
        var cur = a[i0 - 1][j - 1] - u[i0] - v[j];
        if (cur < minv[j]) { minv[j] = cur; way[j] = j0; }
        if (minv[j] < delta) { delta = minv[j]; j1 = j; }
      }
      for (j = 0; j <= m; j++) { if (used[j]) { u[p[j]] += delta; v[j] -= delta; } else minv[j] -= delta; }
      j0 = j1;
    } while (p[j0] !== 0);
    do { var jj = way[j0]; p[j0] = p[jj]; j0 = jj; } while (j0);
  }
  var ans = new Array(n); for (j = 1; j <= m; j++) if (p[j]) ans[p[j] - 1] = j - 1; return ans;
}
// The six standard sticker colors, used to name the colors and to draw the cube.
var PALETTE = [
  { name: "White",  rgb: [235, 235, 235], hex: "#f4f4f4" }, { name: "Yellow", rgb: [235, 205, 40], hex: "#ffd500" },
  { name: "Red",    rgb: [190, 30, 45],   hex: "#c8102e" }, { name: "Orange", rgb: [240, 115, 30], hex: "#ff6a13" },
  { name: "Green",  rgb: [25, 150, 75],   hex: "#009e60" }, { name: "Blue",   rgb: [25, 80, 185],  hex: "#0051ba" }
];
var STD_PALETTE_OF = { U: 0, D: 1, R: 2, L: 3, F: 4, B: 5 };   // the usual color scheme: white top, green front
var PAL_LAB = PALETTE.map(function (p) { return rgbToLab(p.rgb); });

// samples: { U:[9 rgb], R:[...], F:[...], D:[...], L:[...], B:[...] } read straight from the photos.
// The center of each face says which color belongs to that face. Every other sticker goes to the closest center, with exactly 8 per face.
function classifyScan(samples) {
  var centers = LETTERS.split("").map(function (L) { return rgbToLab(samples[L][4]); }), items = [], out = [], li, k;
  LETTERS.split("").forEach(function (L) { for (k = 0; k < 9; k++) if (k !== 4) items.push({ L: L, k: k, lab: rgbToLab(samples[L][k]) }); });
  var cost = items.map(function (it) { var row = []; for (li = 0; li < 6; li++) { var d = labDist(it.lab, centers[li]); for (var c = 0; c < 8; c++) row.push(d); } return row; });
  var assign = hungarian(cost);
  for (var i = 0; i < 54; i++) out.push(null);
  LETTERS.split("").forEach(function (L) { out[FSTART[L] + 4] = L; });
  items.forEach(function (it, idx) { out[FSTART[it.L] + it.k] = LETTERS.charAt(Math.floor(assign[idx] / 8)); });
  // name each face's color: match the six centers to the six standard colors, one each
  var pc = LETTERS.split("").map(function (L, a) { return PAL_LAB.map(function (pl) { return labDist(centers[a], pl); }); }), pa = hungarian(pc), paletteOf = {};
  LETTERS.split("").forEach(function (L, a) { paletteOf[L] = pa[a]; });
  var minGap = Infinity; for (var a = 0; a < 6; a++) for (var b = a + 1; b < 6; b++) minGap = Math.min(minGap, labDist(centers[a], centers[b]));
  return { facelets: out.join(""), paletteOf: paletteOf, minCenterGap: minGap };
}

</script>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var COLORS = {};    // standard scheme: white top, green front, red right
  LETTERS.split("").forEach(function (L) { COLORS[L] = PALETTE[STD_PALETTE_OF[L]].hex; });
  var TURN_MS = 150;  // a quick ease-out turn, so fast typing still feels direct

  var game = { state: SOLVED, queue: [], busy: false, count: 0, started: 0, running: false, scrambled: false, finishedAt: 0, yaw: -35, pitch: -26, helping: false };

  /* ---------- drawing the cube in 3D ---------- */
  var cubeEl = $("cube"), stickers = [];
  function px(v) { return "calc(var(--c) * " + v + ")"; }
  function orient(n) {
    if (n[2] === 1) return ""; if (n[2] === -1) return " rotateY(180deg)";
    if (n[0] === 1) return " rotateY(90deg)"; if (n[0] === -1) return " rotateY(-90deg)";
    return n[1] === 1 ? " rotateX(90deg)" : " rotateX(-90deg)";
  }
  // each sticker's resting place: its small cube's position, pushed out half a cube along the side it faces (screen y points down)
  var BASE = STK.map(function (s) {
    var p = [s.cell[0] + s.n[0] / 2, s.cell[1] + s.n[1] / 2, s.cell[2] + s.n[2] / 2];
    return "translate3d(" + px(p[0]) + "," + px(-p[1]) + "," + px(p[2]) + ")" + orient(s.n);
  });
  for (var i = 0; i < 54; i++) { var d = document.createElement("div"); d.className = "st"; d.style.transform = BASE[i]; cubeEl.appendChild(d); stickers.push(d); }
  function paint() { for (var i = 0; i < 54; i++) stickers[i].style.setProperty("--col", COLORS[game.state.charAt(i)]); }
  function view() { cubeEl.style.transform = "rotateX(" + game.pitch + "deg) rotateY(" + game.yaw + "deg)"; }
  // turn one layer of stickers by `deg` around the side's axis (a clockwise turn, seen from outside that side, is +90 on screen)
  function layerOf(f) { var n = STK[FSTART[f]].n; return STK.map(function (s, i) { return n[0] * s.cell[0] + n[1] * s.cell[1] + n[2] * s.cell[2] === 1 ? i : -1; }).filter(function (i) { return i >= 0; }); }
  var LAYERS = {}; LETTERS.split("").forEach(function (f) { LAYERS[f] = layerOf(f); });
  function setLayerAngle(f, deg) {
    var n = STK[FSTART[f]].n, rot = deg ? "rotate3d(" + n[0] + "," + (-n[1]) + "," + n[2] + "," + deg + "deg) " : "";
    LAYERS[f].forEach(function (i) { stickers[i].style.transform = rot + BASE[i]; });
  }
  window.__setLayerAngle = setLayerAngle;   // used by the test to check the turn direction

  /* ---------- turning ---------- */
  var easeOut = function (t) { return 1 - Math.pow(1 - t, 3); };
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function queueMove(m, fromUser) {
    game.queue.push({ m: m, user: fromUser });
    if (!game.busy) runQueue();
  }
  function runQueue() {
    var job = game.queue.shift(); if (!job) { game.busy = false; return; }
    game.busy = true;
    var f = job.m.charAt(0), target = job.m.length === 1 ? 90 : (job.m.charAt(1) === "'" ? -90 : 180);
    var dur = (job.m.length > 1 && job.m.charAt(1) === "2" ? 1.4 : 1) * (job.user ? TURN_MS : 90);
    if (game.queue.length > 2) dur *= 0.5;              // catch up when keys are pressed faster than the turns
    var t0 = performance.now();
    function frame(now) {
      var t = Math.min(1, (now - t0) / dur);
      setLayerAngle(f, target * easeOut(t));
      if (t < 1 && !reduce) return requestAnimationFrame(frame);
      setLayerAngle(f, 0); game.state = applyMove(game.state, job.m); paint();
      if (job.user) afterUserMove();
      runQueue();
    }
    requestAnimationFrame(frame);
  }
  function afterUserMove() {
    game.count++; $("count").textContent = game.count;
    if (game.scrambled && !game.running && !game.finishedAt) { game.running = true; game.started = performance.now(); tick(); }
    if (game.scrambled && game.state === SOLVED && game.queue.length === 0) solved();
  }
  function solved() {
    game.running = false; game.scrambled = false; game.finishedAt = performance.now();
    var t = $("time").textContent;
    $("banner").textContent = game.helping ? "Solved!" : "Solved in " + t; $("banner").classList.add("on");
    $("status").textContent = game.helping ? "Solved." : game.count + " moves.";
    game.helping = false;
  }
  function fmt(ms) { var s = ms / 1000, m = Math.floor(s / 60); s -= m * 60; return m + ":" + (s < 10 ? "0" : "") + s.toFixed(1); }
  function tick() { if (!game.running) return; $("time").textContent = fmt(performance.now() - game.started); requestAnimationFrame(tick); }

  function resetStats() { game.count = 0; game.running = false; game.finishedAt = 0; game.helping = false; $("count").textContent = "0"; $("time").textContent = "0:00.0"; $("banner").classList.remove("on"); }
  function scramble() {
    if (game.busy) return;
    resetStats(); var sc = randomScramble(22);
    parseAlg(sc).forEach(function (m) { game.queue.push({ m: m, user: false }); });
    game.scrambled = true; game.lastScramble = sc;
    $("status").textContent = "Go!";
    runQueue();
  }
  function reset() { game.queue = []; game.state = SOLVED; game.scrambled = false; resetStats(); paint(); $("status").textContent = "Press Scramble."; }

  /* ---------- "Solve it for me": the solver loads only when asked, and its answer is checked before it is played ---------- */
  var solverReady = null;
  function loadScript(src) { return new Promise(function (res, rej) { var s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = function () { rej(new Error("Could not load the solver.")); }; document.head.appendChild(s); }); }
  function loadSolver() { if (!solverReady) solverReady = loadScript("vendor/cube.js").then(function () { return loadScript("vendor/solve.js"); }).then(function () { Cube.initSolver(); }); return solverReady; }
  function helpMe() {
    if (game.busy || game.state === SOLVED) { if (game.state === SOLVED) $("status").textContent = "Already solved."; return; }
    $("status").textContent = "Thinking...";
    setTimeout(function () {
      loadSolver().then(function () {
        var start = game.state, sol = Cube.fromString(start).solve(), moves = parseAlg(typeof sol === "string" ? sol : "");
        if (!moves.length || moves.some(function (m) { return !/^[URFDLB][2']?$/.test(m); }) || applyAlg(start, moves.join(" ")) !== SOLVED) { $("status").textContent = "Couldn't solve it. Try again."; return; }
        game.helping = true; $("status").textContent = "Solving...";
        moves.forEach(function (m) { game.queue.push({ m: m, user: true }); }); runQueue();
      }).catch(function (e) { $("status").textContent = (e && e.message) || "Something went wrong."; });
    }, 30);
  }

  /* ---------- keyboard, touch pad and dragging ---------- */
  var KEYMAP = { KeyA: "L", KeyS: "U", KeyD: "F", KeyJ: "R", KeyK: "D", KeyL: "B" };
  var KEY_OF = { L: "A", U: "S", F: "D", R: "J", D: "K", B: "L" };
  function flashKey(m) { var k = document.querySelector('.key[data-m="' + m + '"]'); if (!k) return; k.classList.add("flash"); setTimeout(function () { k.classList.remove("flash"); }, 140); }
  function userMove(m) { if (game.helping) return; flashKey(m); queueMove(m, true); }
  document.addEventListener("keydown", function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var f = KEYMAP[e.code];
    if (f) { e.preventDefault(); if (!e.repeat) userMove(f + (e.shiftKey ? "'" : "")); return; }
    var step = 12;
    if (e.key === "ArrowLeft") game.yaw -= step; else if (e.key === "ArrowRight") game.yaw += step;
    else if (e.key === "ArrowUp") game.pitch = Math.max(-80, game.pitch - step); else if (e.key === "ArrowDown") game.pitch = Math.min(80, game.pitch + step);
    else return;
    e.preventDefault(); view();
  });
  var pad = $("pad"), NAMES = { L: "LEFT", U: "TOP", F: "FRONT", R: "RIGHT", D: "BOTTOM", B: "BACK" };
  [["L", "U", "F", "R", "D", "B"]].forEach(function (rowMoves) { rowMoves.forEach(function (m) {
    var b = document.createElement("button"), f = m.charAt(0), back = m.length > 1; b.className = "key"; b.dataset.m = m;
    b.innerHTML = (back ? "&#8679;" : "") + KEY_OF[f] + "<small>" + NAMES[f] + "</small>";
    b.setAttribute("aria-label", "Turn the " + NAMES[f].toLowerCase() + " side " + (back ? "counterclockwise" : "clockwise"));
    b.onclick = function () { userMove(m); }; pad.appendChild(b);
  }); });
  var drag = null, stage = $("stage");
  stage.addEventListener("pointerdown", function (e) { drag = { x: e.clientX, y: e.clientY, yaw: game.yaw, pitch: game.pitch }; try { stage.setPointerCapture(e.pointerId); } catch (x) {} });
  stage.addEventListener("pointermove", function (e) { if (!drag) return; game.yaw = drag.yaw + (e.clientX - drag.x) * 0.5; game.pitch = Math.max(-80, Math.min(80, drag.pitch - (e.clientY - drag.y) * 0.5)); view(); });
  ["pointerup", "pointercancel"].forEach(function (ev) { stage.addEventListener(ev, function () { drag = null; }); });
  $("scramble").onclick = scramble; $("reset").onclick = reset; $("helpme").onclick = helpMe;

  paint(); view();
  window.__game = game;   // read-only hook used by the tests
})();
</script>
</body>
</html>
